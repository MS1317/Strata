name: Weehzi Qwen3.5 model format checks
on:
  push:
    branches:
      - feat/qwen35-9b-long-context
    paths:
      - 'tests/core/model_family_test.cpp'
      - 'tests/core/qwen35_kv_q8_test.cpp'
      - 'CMakeLists.txt'
      - 'include/strata/artifact/**'
      - 'include/strata/core/**'
      - '.github/workflows/weehzi-qwen35-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-family-no-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU-only unit-test build
        run: cmake -S . -B build-weehzi -DSTRATA_BUILD_TESTS=ON -DSTRATA_ENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build model-family and compact-KV tests
        run: cmake --build build-weehzi --target model_family_test qwen35_kv_q8_test --parallel 2
      - name: Run model-family and compact-KV tests
        run: ctest --test-dir build-weehzi -R 'model_family_test|qwen35_kv_q8_test' --output-on-failure
